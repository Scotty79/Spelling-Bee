<style>
/* Layout: one calm column (max 760px) built for an iPad held in two hands. Big round buttons, one job per screen.
   Each game gets its own skin by setting data-game on a container: Say to Spell = tangerine + speech bubble,
   Write to Spell = teal + pen (coming), Beast Mode = violet + bolt (coming). Components only read --accent tokens. */
:root{
  --bg:#F1F3F9; --surface:#FFFFFF; --surface-2:#E6EAF5; --ink:#17203F; --muted:#586080; --line:#D3D9EA;
  --say:#D4470C; --say-deep:#A83606; --say-soft:#FFE3D4; --on-say:#FFFFFF;
  --write:#0A7488; --write-deep:#075968; --write-soft:#D3EFF4; --on-write:#FFFFFF;
  --beast:#5B3FC4; --beast-deep:#4630A0; --beast-soft:#E4DEF9; --on-beast:#FFFFFF;
  --good:#1B7F4A; --good-soft:#D9F3E4; --on-good:#FFFFFF;
  --warn:#9A5200; --warn-soft:#FFEBCB; --on-warn:#FFFFFF;
  --focus:#1F5FD6;
  --display:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:var(--ink); --accent-deep:var(--ink); --accent-soft:var(--surface-2); --on-accent:var(--bg); --hl:var(--say);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1329; --surface:#181F3D; --surface-2:#232C55; --ink:#ECEFFA; --muted:#A3ACCB; --line:#2D3763;
    --say:#FF7A3D; --say-deep:#FFA474; --say-soft:#4A2210; --on-say:#2A0D01;
    --write:#46C6DC; --write-deep:#7EDCEC; --write-soft:#0E3B45; --on-write:#04242B;
    --beast:#A794F5; --beast-deep:#C3B6FA; --beast-soft:#2E2562; --on-beast:#1A1240;
    --good:#5BD08C; --good-soft:#123D26; --on-good:#062B17;
    --warn:#FFC36B; --warn-soft:#4A3208; --on-warn:#2B1A00;
    --focus:#8DB4FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1329; --surface:#181F3D; --surface-2:#232C55; --ink:#ECEFFA; --muted:#A3ACCB; --line:#2D3763;
  --say:#FF7A3D; --say-deep:#FFA474; --say-soft:#4A2210; --on-say:#2A0D01;
  --write:#46C6DC; --write-deep:#7EDCEC; --write-soft:#0E3B45; --on-write:#04242B;
  --beast:#A794F5; --beast-deep:#C3B6FA; --beast-soft:#2E2562; --on-beast:#1A1240;
  --good:#5BD08C; --good-soft:#123D26; --on-good:#062B17;
  --warn:#FFC36B; --warn-soft:#4A3208; --on-warn:#2B1A00;
  --focus:#8DB4FF; color-scheme:dark;
}
[data-game="say"]{--accent:var(--say);--accent-deep:var(--say-deep);--accent-soft:var(--say-soft);--on-accent:var(--on-say);--hl:var(--say)}
[data-game="write"]{--accent:var(--write);--accent-deep:var(--write-deep);--accent-soft:var(--write-soft);--on-accent:var(--on-write);--hl:var(--write)}
[data-game="beast"]{--accent:var(--beast);--accent-deep:var(--beast-deep);--accent-soft:var(--beast-soft);--on-accent:var(--on-beast);--hl:var(--beast)}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.pill.timer{background:var(--accent-soft);border-color:transparent;color:var(--accent-deep)}

.pad-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:0}
.pad{width:100%;height:min(32vh,210px);background:#fffdf7;border:2px solid var(--line);border-radius:22px;display:block;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}

.heardline:empty::after{content:'\2026';opacity:.4}
/* sits above the sticky bar (z-index 5) and the safe-area strip (10) */

  padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.4)}

<script>
(function(){
'use strict';

/* ==PURE START== */
const CATS=[{id:'core',label:'Core'},{id:'easy',label:'Easy'},{id:'medium',label:'Medium'},{id:'challenging',label:'Challenging'}];
const CAT_IDS=CATS.map(c=>c.id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function normWord(w){return String(w==null?'':w).replace(/[‘’]/g,"'").trim().replace(/\s+/g,' ');}
function wordKey(w){return normWord(w).toLowerCase();}
function validWord(w){return w.length>0&&w.length<=40&&/^\p{L}[\p{L}' -]*$/u.test(w);}
function uid(){return Math.random().toString(36).slice(2,8);}
function slug(name){return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'kid';}

/* '' = no bank given, null = not recognised, else a bank id */
function catFrom(t){
  t=String(t==null?'':t).trim().toLowerCase();
  if(!t) return '';
  if(t==='core') return 'core';
  if(t==='easy') return 'easy';
  if(t==='medium'||t==='med') return 'medium';
  if(t==='challenging'||t==='challenge'||t==='hard'||t==='difficult') return 'challenging';
  return null;
}
/* split on the first two commas or tabs only, so a sentence may contain commas */
function splitLine(line){
  const out=[]; let rest=line;
  for(let n=0;n<2;n++){
    const m=rest.search(/[,\t]/);
    if(m<0) break;
    out.push(rest.slice(0,m)); rest=rest.slice(m+1);
  }
  out.push(rest);
  return out.map(s=>s.trim());
}
function parseImport(text,defCat,existingKeys){
  const seen=new Set(existingKeys||[]); const add=[]; const bad=[]; let dupes=0;
  String(text==null?'':text).split(/\r?\n/).forEach((raw,idx)=>{
    const line=raw.trim(); if(!line) return;
    const p=splitLine(line);
    if(idx===0&&p.length>1&&/^word$/i.test(p[0])) return;
    const w=normWord(p[0]);
    if(!validWord(w)){bad.push({line,why:'Words can only use letters, hyphens and apostrophes'});return;}
    let c=defCat,s='';
    if(p.length===2){const cc=catFrom(p[1]); if(cc) c=cc; else if(cc===null) s=p[1];}
    else if(p.length>=3){
      const cc=catFrom(p[1]);
      if(cc===null){bad.push({line,why:'Unknown bank “'+p[1]+'”'});return;}
      if(cc) c=cc; s=p[2];
    }
    const key=wordKey(w);
    if(seen.has(key)){dupes++;return;}
    seen.add(key); add.push({w,c,s:s.trim()});
  });
  return {add,dupes,bad};
}

/* where the spelling word sits inside its sentence (exact word first, then a longer form such as "running") */
function findWord(sentence,word){
  if(!sentence||!word) return null;
  const w=escRe(word);
  let m=new RegExp('(^|[^\\p{L}\\p{N}])('+w+')(?![\\p{L}\\p{N}])','iu').exec(sentence);
  if(!m) m=new RegExp('(^|[^\\p{L}\\p{N}])('+w+'\\p{L}*)','iu').exec(sentence);
  if(!m) return null;
  const start=m.index+m[1].length;
  return {start,end:start+m[2].length};
}
function highlight(sentence,word){
  if(!sentence) return '<mark>'+esc(word)+'</mark>';
  const f=findWord(sentence,word);
  if(!f) return esc(sentence);
  return esc(sentence.slice(0,f.start))+'<mark>'+esc(sentence.slice(f.start,f.end))+'</mark>'+esc(sentence.slice(f.end));
}

  try{read=snap?await readHandwriting(snap):null;}catch(e){err=checkError(e);}
  /* they may have quit or moved on while Claude was reading */
  if(!R||S.screen!=='ask'||cur()!==w||(R.i+':'+R.attempt)!==tok) return;
  R.read=read;
  const v=judgeRead(read,w.w);
  if(v==='unsure'){R.err=err; R.phase='unsure'; render(); window.scrollTo(0,0); return;}
  mark(v==='ok');
}

function adminWords(k){
  const counts={all:k.words.length}; CAT_IDS.forEach(id=>{counts[id]=k.words.filter(w=>w.c===id).length;});
  const missing=k.words.filter(w=>!w.s).length, starter=k.words.filter(w=>w.x).length;
  const rows=k.words.filter(w=>S.filter==='all'||w.c===S.filter).sort((a,b)=>a.w.localeCompare(b.w));
  let h='';
  if(starter) h+='<div class="note flex"><span style="flex:1;min-width:200px">Includes '+starter+' starter words so you can try the game.</span><button class="btn btn-ghost sm" data-act="rmstarter">Remove starter words</button></div>';

  h+='<details class="panel"><summary>Paste a list of words</summary><form data-form="import" class="stack" style="margin-top:12px">'+

    '<div class="field"><label for="imp-t">Your list</label><textarea id="imp-t" name="t" rows="6" spellcheck="false" autocapitalize="none" placeholder="because\nfriend, easy\ncurious, medium, The curious kitten peeked into the box."></textarea></div>'+
    '<div class="field"><label for="imp-c">Bank for lines that don’t say</label><select id="imp-c" name="c">'+catOptions(S.addCat)+'</select></div>'+
    '<div class="flex"><button class="btn btn-primary sm" type="submit">Import words</button></div></form></details>';
  if(missing&&S.canGen){
    h+='<div class="note flex"><span style="flex:1;min-width:200px" id="genstatus" aria-live="polite">'+genText(missing)+'</span><button class="btn btn-ghost sm" data-act="gen"'+(S.gen&&S.gen.running?' disabled':'')+'>Write missing sentences</button></div>';
  }else if(missing){
    h+='<p class="note">'+missing+' word'+(missing===1?' has':'s have')+' no sentence yet. Those words are read out twice, with no sentence in between.</p>';
  }

function genText(missing){
  const g=S.gen;
  if(!g) return missing+' word'+(missing===1?' has':'s have')+' no sentence. Claude can write them for you, and you can edit any you don’t like.';
  if(g.running) return 'Writing sentences… '+g.done+' of '+g.total+' done.';
  return 'Wrote '+g.done+' sentence'+(g.done===1?'':'s')+(g.bad?'; '+g.bad+' didn’t come out right, so those are still empty':'')+'.'+(g.err?' '+g.err:'');
}

function render(){
  const game=['setup','ask','result','done'].includes(S.screen)&&!S.loading&&!S.loadError;
  if(game){ $app.dataset.game=((S.screen==='ask'||S.screen==='result')&&R&&R.game==='beast')?(R.modes[R.i]||'say'):((R&&R.game)||S.game||'say'); } else delete $app.dataset.game;
  let h;
  if(S.loading) h=viewLoading();
  else if(S.loadError) h=viewLoadError();
  else{
    switch(S.screen){
      case 'kid':h=viewKid();break; case 'tricky':h=viewTricky();break; case 'setup':h=viewSetup();break;
      case 'ask':h=viewAsk();break; case 'result':h=viewResult();break; case 'done':h=viewDone();break;
      case 'admin':h=viewAdmin();break; default:h=viewHome();
    }
  }
  $app.innerHTML=h;
  if(S.screen==='ask'&&R&&mode()==='write'&&R.phase==='write') initPad();
  if(S.focus){const el=document.getElementById(S.focus);S.focus=null;if(el) el.focus();}
}

/* ---------- game flow (shared by Say and Write) ---------- */
function beastPool(k){
  const byKey=new Map(k.words.map(w=>[wordKey(w.w),w]));
  const tricky=trickyList(k).map(t=>byKey.get(t.key)).filter(Boolean).slice(0,20);
  const used=new Set(tricky.map(w=>wordKey(w.w)));
  const chall=shuffle(k.words.filter(w=>w.c==='challenging'&&!used.has(wordKey(w.w)))).slice(0,20-tricky.length);
  return {words:shuffle(tricky.concat(chall)),trickyUse:tricky.length,fill:chall.length};
}
function startRound(){
  const k=kid();
  const words=S.game==='beast'?beastPool(k).words:pickRound(k.words,S.bank,20);
  if(!words.length) return;
  R={words,n:words.length,i:0,score:0,attempt:0,verdict:null,reveal:false,speaking:false,quit:false,missed:[],read:null,err:'',flipped:false,applied:null,heard:'',listening:false,listenStart:0,lastHeard:0,
     game:S.game,phase:null,time:0,shot:null,strokes:[],modes:S.game==='beast'?words.map(()=>Math.random()<0.5?'say':'write'):[]};
  window.scrollTo(0,0); askCurrent();
}
function askCurrent(){
  S.screen='ask';
  if(mode()==='write') beginWriteWord(); else beginSayWord();
}
function beginSayWord(){
  const w=cur();
  R.phase='listen'; R.heard=''; R.read=null; R.err=''; R.listening=false; R.speaking=!!synth;
  render(); window.scrollTo(0,0);
  const toSpeak=()=>{
    if(!R||S.screen!=='ask'||mode()!=='say'||cur()!==w) return;
    R.phase='speak'; R.speaking=false; render();
    /* Try to start listening straight away; if the browser wants a tap first,
       fall back to the microphone button for the rest of the session. */
    if(canHear()&&!S.micTap&&!startListening()){ S.micTap=true; render(); }
  };
  if(!synth){ toSpeak(); return; }
  speakSeq([w.w,w.s,w.w].filter(Boolean), toSpeak);
}
function speakCurrent(){
  const w=cur();
  if(!synth){R.speaking=false;R.reveal=true;render();return;}
  R.speaking=true; render();
  speakSeq([w.w,w.s,w.w].filter(Boolean),()=>{
    if(R&&S.screen==='ask'&&mode()==='say'&&cur()===w){R.speaking=false;render();}
  });
}
function beginWriteWord(){
  const w=cur(); R.phase='listen'; R.strokes=[]; R.shot=null; R.time=0; R.speaking=!!synth; render(); window.scrollTo(0,0);
  const toWrite=()=>{ if(R&&S.screen==='ask'&&mode()==='write'&&cur()===w){ R.phase='write'; R.speaking=false; render(); startTimer(); } };
  if(!synth){ toWrite(); return; }
  speakSeq([w.w,w.s,w.w].filter(Boolean), toWrite);
}
function mark(ok){
  stopSpeech();
  if(mode()==='write'){ stopTimer(); if(!R.shot){const s=padSnapshot(); R.shot=s?s.toDataURL('image/png'):null;} }
  R.speaking=false;
  applyMark(ok);
  S.screen='result'; render(); window.scrollTo(0,0);
}
/* applyMark records what it changed so a grown-up can flip the verdict cleanly */
function applyMark(ok){
  const w=cur(), k=kid(), key=wordKey(w.w);
  const a={scored:false,tallied:false,beastDec:false,missed:false};
  if(ok){
    if(R.attempt===0){ R.score++; a.scored=true; }
    if(R.game==='beast'&&R.attempt===0&&k.tally[key]>0){ k.tally[key]--; if(!k.tally[key]) delete k.tally[key]; a.beastDec=true; queueSave(k); }
  } else {
    k.tally[key]=(k.tally[key]||0)+1; a.tallied=true; queueSave(k);
    if(!R.missed.includes(w)){ R.missed.push(w); a.missed=true; }
  }
  R.verdict=ok?'ok':'no'; R.applied=a;
}
function unapplyMark(){
  const w=cur(), k=kid(), key=wordKey(w.w), a=R.applied||{};
  if(a.scored) R.score--;
  if(a.tallied){ if(k.tally[key]>1) k.tally[key]--; else delete k.tally[key]; }
  if(a.beastDec) k.tally[key]=(k.tally[key]||0)+1;
  if(a.missed){ const i=R.missed.indexOf(w); if(i>=0) R.missed.splice(i,1); }
  queueSave(k); R.applied=null;
}
function flipVerdict(){
  const was=R.verdict==='ok';
  unapplyMark(); applyMark(!was); R.flipped=true; render(); window.scrollTo(0,0);
}
function nextWord(){
  R.i++; R.attempt=0; R.verdict=null; R.reveal=false; R.quit=false;
  R.read=null; R.err=''; R.flipped=false; R.applied=null; R.shot=null; R.heard=''; stopListening();
  if(R.i>=R.n){S.screen='done';render();window.scrollTo(0,0);return;}
  askCurrent();
}
function retryWord(){
  R.attempt++; R.verdict=null; R.reveal=false; R.quit=false;
  R.read=null; R.err=''; R.flipped=false; R.applied=null; R.shot=null; R.heard=''; stopListening();
  askCurrent();
}

/* ---------- sentences from Claude (optional, runs only on a tap) ---------- */
function sentencePrompt(list){
  return 'You write example sentences for a children’s spelling bee practice app. For each word listed below, write ONE complete, child-safe sentence of 8 to 14 words that uses the word exactly as written, once, in a way that makes its meaning clear to a primary-school child. No brand names, real people, or scary, sad or rude themes. Use Australian English spelling.\n\nReply with only a JSON array of {"word": string, "sentence": string} objects, one per word, in the same order.\n\nWords:\n'+list.join('\n');
}
function genError(e){
  const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared') return 'Sentence writing isn’t allowed for this page.';
  if(c==='rate_limited') return 'That’s too many requests for now. Try again in a minute.';
  return 'Something went wrong. You can try again.';
}
async function genMissing(){
  const k=aKid(); const todo=k.words.filter(w=>!w.s);
  if(!todo.length||(S.gen&&S.gen.running)||!SAMPLE) return;
  S.gen={running:true,done:0,total:todo.length,bad:0,err:''};
  const status=()=>{const el=document.getElementById('genstatus');if(el) el.textContent=genText(todo.length);};
  render();
  for(let i=0;i<todo.length;i+=20){
    const batch=todo.slice(i,i+20);
    try{
      const res=await SAMPLE.json(sentencePrompt(batch.map(w=>w.w)),{modelTier:'quick'});
      const map=new Map((Array.isArray(res)?res:[]).map(r=>[wordKey(r&&r.word),r&&r.sentence]));
      for(const w of batch){const s=cleanSentence(map.get(wordKey(w.w)),w.w);if(s){w.s=s;S.gen.done++;}else S.gen.bad++;}
      queueSave(k); status();
    }catch(e){S.gen.err=genError(e);S.gen.bad+=batch.length;break;}
  }
  S.gen.running=false; render();
}
async function suggestOne(btn){
  const wEl=document.getElementById('e-w'), sEl=document.getElementById('e-s'), note=document.getElementById('suggest-note');
  if(!wEl||!sEl||!SAMPLE) return;
  const w=normWord(wEl.value);
  if(!validWord(w)){if(note) note.textContent='Enter the word first.';return;}
  btn.disabled=true; const old=btn.textContent; btn.textContent='Writing…'; if(note) note.textContent='';
  let err='';
  try{
    const res=await SAMPLE.json(sentencePrompt([w]),{modelTier:'quick',cache:false});
    const s=cleanSentence(Array.isArray(res)&&res[0]&&res[0].sentence,w);
    if(s) sEl.value=s; else err='That one didn’t come out right. Try again.';
  }catch(e){err=genError(e);}
  btn.disabled=false; btn.textContent=old;
  if(note) note.textContent=err;
}

/* ---------- actions ---------- */
function addKid(name){
  name=String(name||'').trim();
  if(!name){flash('Type a name first.','err');S.focus='kid-new';render();return;}
  let id=slug(name); if(S.kids.some(k=>k.id===id)) id+='-'+uid().slice(0,3);
  const k={id,name,order:S.kids.reduce((m,x)=>Math.max(m,x.order),0)+1,words:[],tally:{}};
  S.kids.push(k); S.adminKid=S.adminKid||id; queueSave(k); flash('Added '+name+'.'); render();
}
function act(a,t){
  const id=t.dataset.id;
  switch(a){
    case 'pick':S.kidId=id;go('kid');break;
    case 'home':go('home');break;
    case 'back-kid':go('kid');break;
    case 'tricky':go('tricky');break;
    case 'admin':S.adminKid=S.adminKid||(S.kids[0]&&S.kids[0].id);go('admin');break;
    case 'reload':initStore();break;
    case 'use-local':S.mode='local';S.loadError=null;S.kids=loadLocal();render();break;
    case 'game-say':S.game='say';S.bank=new Set(CAT_IDS.filter(c=>kid().words.some(w=>w.c===c)));go('setup');break;
    case 'game-write':S.game='write';S.bank=new Set(CAT_IDS.filter(c=>kid().words.some(w=>w.c===c)));go('setup');break;
    case 'game-beast':S.game='beast';go('setup');break;
    case 'bank':if(S.bank.has(id)) S.bank.delete(id); else S.bank.add(id); render();break;
    case 'start':startRound();break;
    case 'hear':stopListening();render();if(mode()==='write'){speakSeq([cur().w,cur().s,cur().w].filter(Boolean));}else speakCurrent();break;
    case 'listen-start':if(!startListening()){R.err='The microphone wouldn’t start — a grown-up can mark this one.';}render();break;
    case 'listen-stop':if(rec){try{rec.stop();}catch(e){}}else{R.listening=false;render();}break;
    case 'say-again':R.phase='speak';R.err='';R.read=null;R.heard='';render();break;
    case 'pad-undo':if(pad){pad.strokes.pop();redrawPad();}break;
    case 'pad-clear':if(pad){pad.strokes.length=0;redrawPad();}break;
    case 'reveal':R.reveal=!R.reveal;render();break;
    case 'right':mark(true);break;
    case 'wrong':mark(false);break;
    case 'done-write':doneWriting();break;
    case 'try-again':R.phase='write';R.err='';R.read=null;R.shot=null;R.strokes.length=0;render();startTimer(R.time);break;
    case 'flip':flipVerdict();break;
    case 'checkmode':SET.check=(id==='careful'?'careful':'quick');saveSet();S.test=null;render();break;
    case 'checktest':testChecker();break;
    case 'retry':retryWord();break;
    case 'next':nextWord();break;
    case 'quit':R.quit=true;render();break;
    case 'quit-no':R.quit=false;render();break;
    case 'quit-yes':stopSpeech();go('kid');break;
    case 'akid':S.adminKid=id;S.editId=null;S.delId=null;S.filter='all';S.msg=null;S.gen=null;render();break;
    case 'atab':S.adminTab=id;S.msg=null;render();break;
    case 'filter':S.filter=id;render();break;
    case 'edit':S.editId=id;S.delId=null;S.msg=null;S.focus='e-w';render();break;
    case 'cancel':S.editId=null;S.msg=null;render();break;
    case 'del':S.delId=id;S.editId=null;render();break;
    case 'del-no':S.delId=null;render();break;
    case 'del-yes':{const k=aKid();k.words=k.words.filter(w=>w.id!==id);S.delId=null;queueSave(k);render();break;}
    case 'suggest':suggestOne(t);break;
    case 'gen':genMissing();break;
    case 'rmstarter':{const k=aKid();k.words=k.words.filter(w=>!w.x);queueSave(k);flash('Starter words removed.');render();break;}
    case 'rmtally':{const k=aKid();delete k.tally[t.dataset.key];queueSave(k);render();break;}
    case 'kid-del':S.delKid=id;render();break;
    case 'kid-del-no':S.delKid=null;render();break;
    case 'kid-del-yes':{
      S.kids=S.kids.filter(k=>k.id!==id); S.delKid=null; if(S.adminKid===id) S.adminKid=S.kids[0]&&S.kids[0].id;
      if(S.mode==='cloud'){setSave('saving');DB.doc('kids/'+id).delete().then(()=>setSave('saved'),e=>setSave('error',e&&e.message));}
      else queueSave({id:'x'});
      render();break;}
    case 'voice-test':speakSeq(['bridge','We walked across the bridge to the park.','bridge']);break;
  }
}
function form(name,f){
  const el=f.elements;
  if(name==='addkid'){addKid(el.n.value);return;}
  if(name==='rename'){
    const k=S.kids.find(x=>x.id===f.dataset.id), n=el.n.value.trim();
    if(!k||!n){flash('A name can’t be empty.','err');render();return;}
    k.name=n; queueSave(k); flash('Renamed to '+n+'.'); render(); return;
  }
  const k=aKid(); if(!k) return;
  if(name==='add'){
    const w=normWord(el.w.value), c=el.c.value, s=el.s.value.trim(); S.addCat=c; S.focus='a-w';
    if(!validWord(w)){flash('Words can only use letters, hyphens and apostrophes.','err');render();return;}
    if(k.words.some(x=>wordKey(x.w)===wordKey(w))){flash('“'+w+'” is already on this list.','err');render();return;}
    k.words.push({id:uid(),w,c,s}); queueSave(k);
    flash('Added “'+w+'”.'+(s&&!findWord(s,w)?' The sentence doesn’t contain the word, so it can’t be highlighted.':'')); render(); return;
  }
  if(name==='edit'){
    const word=k.words.find(x=>x.id===f.dataset.id); if(!word) return;
    const w=normWord(el.w.value), s=el.s.value.trim();
    if(!validWord(w)){flash('Words can only use letters, hyphens and apostrophes.','err');render();return;}
    if(k.words.some(x=>x!==word&&wordKey(x.w)===wordKey(w))){flash('“'+w+'” is already on this list.','err');render();return;}
    if(wordKey(w)!==wordKey(word.w)&&k.tally[wordKey(word.w)]){k.tally[wordKey(w)]=(k.tally[wordKey(w)]||0)+k.tally[wordKey(word.w)];delete k.tally[wordKey(word.w)];}
    word.w=w; word.c=el.c.value; word.s=s; delete word.x; S.editId=null; queueSave(k);
    flash('Saved “'+w+'”.'+(s&&!findWord(s,w)?' The sentence doesn’t contain the word, so it can’t be highlighted.':'')); render(); return;
  }
  if(name==='import'){
    const r=parseImport(el.t.value,el.c.value,k.words.map(x=>wordKey(x.w))); S.addCat=el.c.value;
    r.add.forEach(x=>k.words.push({id:uid(),w:x.w,c:x.c,s:x.s}));
    if(r.add.length) queueSave(k);
    let t='Added '+r.add.length+' word'+(r.add.length===1?'':'s')+'.';
    if(r.dupes) t+=' Skipped '+r.dupes+' already on the list.';
    if(r.bad.length) t+=' Couldn’t read '+r.bad.length+' line'+(r.bad.length===1?'':'s')+': '+r.bad.slice(0,3).map(b=>'“'+b.line.slice(0,30)+'” ('+b.why+')').join('; ')+'.';
    flash(t,r.bad.length&&!r.add.length?'err':'ok'); render();
  }
}
function onChange(name,t){
  if(name==='cat'){const k=aKid(),w=k.words.find(x=>x.id===t.dataset.id);if(w){w.c=t.value;queueSave(k);render();}}
  else if(name==='voice'){SET.uri=t.value;saveSet();}
  else if(name==='rate'){SET.rate=Math.min(1.1,Math.max(0.6,Number(t.value)||0.9));saveSet();const v=document.getElementById('ratev');if(v) v.textContent=SET.rate.toFixed(2);}
}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled) return;act(t.dataset.act,t);});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f) return;e.preventDefault();form(f.dataset.form,f);});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');if(t) onChange(t.dataset.change,t);});
if(synth&&synth.addEventListener) synth.addEventListener('voiceschanged',()=>{if(!S.loading&&S.screen==='admin'&&S.adminTab==='settings') render();});
window.addEventListener('resize',()=>{if(pad&&pad.c&&document.getElementById('pad')===pad.c){fitPad();redrawPad();}});

render();
initStore();
})();
</script>
